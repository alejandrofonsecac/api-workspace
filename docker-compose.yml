services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      PORT: 8080
      API_URL: ${API_URL:?Configure a URL JDBC do PostgreSQL}
      API_USER: ${API_USER:?Configure o usuario do PostgreSQL}
      API_PASSWORD: ${API_PASSWORD:?Configure a senha do PostgreSQL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://plannerfy-production.jfonsecacorrea08.chatgpt.site}
