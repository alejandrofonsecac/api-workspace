# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: plannerfy-api-production
    runtime: docker
    repo: https://github.com/alejandrofonsecac/api-workspace
    branch: production
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://plannerfy-production.jfonsecacorrea08.chatgpt.site
      - key: API_URL
        sync: false
      - key: API_USER
        sync: false
      - key: API_PASSWORD
        sync: false
