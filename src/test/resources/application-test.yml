spring:
  datasource:
    url: jdbc:h2:mem:api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

app:
  retention:
    enabled: false
  refresh:
    cleanup:
      enabled: false
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1tdXN0LW5ldmVyLWJlLXVzZWQtaW4tcHJvZA==
    issuer: workspace-api-test
    ttl: PT1H