spring:
  datasource:
    url: ${API_URL}
    username: ${API_USER}
    password: ${API_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:workspace-api}
    ttl: ${JWT_TTL:PT15M}
  refresh:
    max-age: ${REFRESH_MAX_AGE:P90D}
    idle-timeout: ${REFRESH_IDLE_TIMEOUT:P30D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
