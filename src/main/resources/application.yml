spring:
  datasource:
    url: ${API_URL}
    username: ${API_USER}
    password: ${API_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 0 3 * * *}
    batch-size: ${RETENTION_BATCH_SIZE:500}
    max-batches-per-resource: ${RETENTION_MAX_BATCHES:100}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:workspace-api}
    ttl: ${JWT_TTL:PT15M}
  refresh:
    max-age: ${REFRESH_MAX_AGE:P90D}
    idle-timeout: ${REFRESH_IDLE_TIMEOUT:P30D}
    cleanup:
      enabled: ${REFRESH_CLEANUP_ENABLED:true}
      cron: ${REFRESH_CLEANUP_CRON:0 30 3 * * *}
      batch-size: ${REFRESH_CLEANUP_BATCH_SIZE:500}
      max-batches: ${REFRESH_CLEANUP_MAX_BATCHES:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
